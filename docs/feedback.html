<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обратная связь - Food Construct</title>
    <link rel="stylesheet" href="main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap" rel="stylesheet">
    <style>
        .feedback-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        
        input[type="text"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: "Merriweather", "Arial", sans-serif;
            font-size: 16px;
        }
        
        textarea {
            height: 150px;
            resize: vertical;
        }
        
        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .submit-btn {
            background-color: #e63946;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            font-family: "Merriweather", "Arial", sans-serif;
        }
        
        .submit-btn:hover {
            background-color: #d32f2f;
        }
    </style>
</head>
<body>
    <header class="header">
        <h1 class="h1">Food Construct</h1>
        <nav class="nav">
            <a class="header a" href="index.html">О нас</a>
            <a class="header a" href="lunch.html">Собрать ланч</a>
            <a class="header a">Заказы</a>
            <a class="header a" href="login.html">Вход</a>
            <a class="header a" href="feedback.html">Обратная связь</a>
            <a class="header a" href="index.html#section-2">Контакты</a>
        </nav>
    </header>
    
    <main class="container">
        <div class="feedback-container">
            <h2>Обратная связь</h2>
            <form action="https://httpbin.org/post" method="POST" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="fullname">ФИО *</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label>Откуда узнали о нас *</label>
                    <div class="radio-group">
                        <div class="radio-option">
                            <input type="radio" id="source-friends" name="source" value="friends" required>
                            <label for="source-friends">От друзей/коллег</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="source-internet" name="source" value="internet">
                            <label for="source-internet">Из интернета</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="source-social" name="source" value="social">
                            <label for="source-social">Социальные сети</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="source-other" name="source" value="other">
                            <label for="source-other">Другое</label>
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="type">Тип обращения *</label>
                    <select id="type" name="type" required>
                        <option value="">Выберите тип обращения</option>
                        <option value="complaint">Жалоба</option>
                        <option value="suggestion">Предложение</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="message">Текст сообщения *</label>
                    <textarea id="message" name="message" required></textarea>
                </div>
                
                <div class="form-group">
                    <label for="attachment">Вложения</label>
                    <input type="file" id="attachment" name="attachment">
                </div>
                
                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="consent" name="consent" required>
                        <label for="consent">Даю согласие на обработку персональных данных *</label>
                    </div>
                </div>
                
                <button type="submit" class="submit-btn">Отправить</button>
            </form>
        </div>
    </main>
    
    <footer class="footer">
        <p class="p">Позвонить нам: <a href="tel:+70000000000">+7-000-000-00-00</a></p>
    </footer>
</body>
</html>
